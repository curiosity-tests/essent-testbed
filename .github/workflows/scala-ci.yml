name: Scala/C++ CI
run-name: "Scala/C++ CI ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"

on:
  push:
  pull_request:

  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""


env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
jobs:
  small-designs:
    runs-on: ubuntu-slim

    env:
      JAVA_OPTS: -Xms2048M -Xmx2048M -Xss6M

    steps:
      - name: checkout essent & firrtl-sig
        uses: actions/checkout@v6
        with:
            submodules: true

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: sbt
      - uses: sbt/setup-sbt@v1

      - name: build
        run: sbt compile

      - name: run small designs
        run: sbt 'run all'
